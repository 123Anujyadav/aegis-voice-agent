# =============================================================================
# ci-gate: one check that ALWAYS runs on a pull request, for branch protection.
#
# pr-go, hardening and the other workflows are path-filtered on pull_request,
# so a docs-only or workflow-only PR never starts them. A required check that
# never starts blocks the PR forever. This job always starts, works out from
# each workflow's pull_request filters which of them this PR triggers, waits
# for those runs on the PR head, and passes only if all their jobs passed.
#
# Lint: a golangci-lint job that ALSO fails on main's latest completed run is
# the known baseline, but only if its findings, counted per (file, linter),
# are no more than main's. A new finding in an already-failing module, a lint
# job that passes on main, or a new module's lint job must pass. Nothing is
# excluded from lint itself.
#
# TRUST
# - The verdict comes from the gate script and workflow filters at the CURRENT
#   TIP of the base branch (github.base_ref). github.event.pull_request.base.sha
#   is not used: GitHub does not keep it current, so for a PR opened before the
#   gate merged it would name a commit without the gate.
# - The verdict step runs BEFORE any code from the pull request is executed.
#   Checking a PR out executes nothing. The PR's own gate tests run last, so
#   they cannot alter the files the verdict used, and they can fail the job
#   but never pass it.
# - Bootstrap: when the base tip has no gate (only the PR that introduces it,
#   or a PR into a branch without it), the PR's copy is used, with a warning.
#   Once the gate is on main, that path is unreachable for PRs into main.
# - Residual: GitHub runs a pull_request workflow from the PR's version of the
#   workflow file, so a PR editing THIS file (or pr-go.yml, etc.) is trusted
#   only through code review. Require review for .github/** and tools/ci/**.
#
# Read-only. It uses only the job's own token (actions, contents and
# pull-requests: read), the gh CLI and the Python standard library: no
# third-party action and no secret. See tools/ci/ci_gate.py.
#
# Not a merge_group gate: no merge queue is configured, and pull_request-only
# workflows (ci.yml, hardening.yml) do not run in a merge group.
# =============================================================================
name: ci-gate

on:
  pull_request:

concurrency:
  group: ci-gate-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  gate:
    name: ci-gate
    runs-on: ubuntu-24.04
    # hardening's repeated race job is the longest (about 30 min under load);
    # the gate's own wait is capped below this.
    timeout-minutes: 120
    steps:
      - name: Check out the base branch tip (trusted gate and workflow filters)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      # Only when the base has no gate yet. Checkout executes no PR code.
      - name: Check out the pull request (bootstrap only)
        if: ${{ hashFiles('trusted/tools/ci/ci_gate.py') == '' }}
        uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 1
          persist-credentials: false

      # The verdict. Nothing from the pull request has executed before this
      # step.
      - name: Wait for and judge the PR's workflows (trusted gate)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f trusted/tools/ci/ci_gate.py ]; then
            gate=trusted
          else
            echo "::warning::bootstrap: the base branch has no ci-gate yet, so this run uses the pull request's copy"
            gate=pr
          fi
          python3 -I "$gate/tools/ci/ci_gate.py" \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --workflows-dir "$gate/.github/workflows" \
            --total-timeout 6600

      - name: Check out the pull request (its own gate tests)
        if: ${{ hashFiles('pr/tools/ci/ci_gate.py') == '' }}
        uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 1
          persist-credentials: false

      # Runs the PR's code, so it comes after the verdict: it can fail the
      # job, and cannot change a verdict that has already been given.
      - name: Test the pull request's gate code
        run: |
          if [ -d pr/tools/ci ]; then
            python3 -I -m unittest discover -s pr/tools/ci -p '*_test.py' -v
          else
            echo "the pull request has no tools/ci; nothing to test"
          fi
