# =============================================================================
# The app's instrumented tests on Android emulators, nightly and on demand.
# pr-android.yml only compiles them; until this workflow, every device result
# was a local run (production-readiness F6).
#
# API levels: nightly and on demand, 35 (the current platform), 28 (Android 9,
# the last without the call-screening role) and 26 (minSdk). On a pull
# request, 35 only. The tests suppress what an API level cannot do
# (@SdkSuppress), so each level runs the cases that apply to it.
#
# After the tests, the script launches the R8-minified staging build on the
# same emulator (a smoke check: alive after 15 s, no fatal exception, window
# on screen); nothing else ever runs the minified app on a device.
#
# Not on every pull request: each API level takes a runner for about eight
# minutes (7m25s for API 35 on 2026-11-01, boot included). It runs on a pull
# request only when this workflow, its script or the instrumented tests
# change, so a change to any of them is proven before merge; ci-gate then
# waits for it like any other triggered workflow.
#
# Toolchain: the runner's JDK 17 and Android SDK, as pr-android.yml. The
# emulator is driven by tools/scripts/android-device-tests.sh with the SDK's
# own tools; no third-party action runs with the checkout.
# =============================================================================
name: android-device-tests

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      api:
        description: "One API level to run (for example 28); empty runs 35, 28 and 26"
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/android-device-tests.yml"
      - "tools/scripts/android-device-tests.sh"
      - "android/app/src/androidTest/**"

concurrency:
  group: android-device-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device-tests:
    name: Instrumented tests on an emulator (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(github.event_name == 'pull_request' && '[35]' || inputs.api != '' && inputs.api != null && format('[{0}]', inputs.api) || '[35, 28, 26]') }}
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
      ANDROID_TEST_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use the runner's JDK 17 and Android SDK
        run: |
          test -n "${JAVA_HOME_17_X64:-}" || { echo "::error::JDK 17 is not preinstalled on this image"; exit 1; }
          test -d "${ANDROID_HOME:-}" || { echo "::error::the Android SDK is not preinstalled on this image"; exit 1; }
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"

      # Hardware acceleration for the emulator: the runner exposes /dev/kvm,
      # but only to root until this rule opens it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (emulator, API ${{ matrix.api }})
        run: tools/scripts/android-device-tests.sh

      # The HTML report and per-test results, and the emulator log and
      # logcat, which is where a crash or a boot failure shows.
      - name: Keep the test reports and device logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-device-test-reports-api${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/device-test-logs/
          if-no-files-found: ignore
          retention-days: 14
