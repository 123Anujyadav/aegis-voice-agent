# =============================================================================
# Python PR gate.
#
# Runs only when Python code, its manifests or this workflow change. Path
# filtering is the mechanism that keeps a monorepo's CI cost proportional to the
# change rather than to the repository (Phase 1 §16); without it, an Android-only
# PR would run every Python job for nothing.
# =============================================================================
name: pr-python

on:
  pull_request:
    paths:
      - "services/python/**"
      - "packages/python/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pr-python.yml"
  merge_group:

# Cancel superseded runs on the same branch. Without this, pushing three commits
# in quick succession keeps three full runs alive and the first two are already
# irrelevant.
concurrency:
  group: pr-python-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Least privilege by default. Any job needing more requests it explicitly; a
# workflow with write access by default is how a compromised action escalates.
permissions:
  contents: read

env:
  # Reproducible resolution: fail rather than silently re-resolving if uv.lock
  # does not match the manifests.
  UV_FROZEN: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-24.04
    # Bounded so a hung job cannot occupy a runner until the six-hour default.
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Shallow: no job here needs history. Full history on a large monorepo
          # is a meaningful share of total job time.
          fetch-depth: 1
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
          # Cache keyed on the lockfile: the environment is restored verbatim
          # whenever dependencies are unchanged, which is most PRs.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the Python toolchain
        # The version is pinned in pyproject.toml's requires-python. Installing
        # it here rather than relying on the runner's preinstalled Python keeps
        # the CI interpreter identical to the container image's.
        run: uv python install 3.12

      - name: Sync the workspace
        run: uv sync --all-packages --dev

      # Formatting is checked before linting so that a purely cosmetic failure
      # is reported as such, rather than as a wall of lint findings.
      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type-check (strict)
        run: uv run mypy packages/python services/python

      - name: Test
        run: >-
          uv run pytest
          --cov
          --cov-report=xml
          --cov-report=term-missing:skip-covered
          --junitxml=junit.xml

      # Always uploaded, including on failure — the report is most useful
      # precisely when the job failed.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: |
            junit.xml
            coverage.xml
          retention-days: 7

  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # A manifest edited without regenerating the lockfile is a common and
      # easily-missed mistake. It surfaces later as a container build failure
      # (the image builds with --frozen), where the cause is far less obvious
      # than it is here.
      - name: Verify uv.lock matches the manifests
        run: uv lock --check
