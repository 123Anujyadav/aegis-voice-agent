# =============================================================================
# Phase 10.5 hardening gate.
#
# WHY THIS EXISTS SEPARATELY FROM pr-go.yml
#
# pr-go.yml is the per-module PR gate: build, race, lint, format, vulnerability
# scan. It is correct and this file does not duplicate it.
#
# This workflow covers the things Phase 10.5 identified as missing, all of which
# are whole-platform properties rather than per-module ones:
#
#   - race verification reported as a first-class artifact, so "has -race ever
#     actually run against the AI plane" has an answer somebody can point at
#   - benchmark execution, so a performance regression is visible before a
#     release rather than after an incident
#   - coverage aggregated across modules with an explicit floor
#   - the cross-subsystem observability check, which only compiles in
#     packages/go/evalsubjects because that is the only module importing all
#     five engines
#   - a release gate that fails closed
#
# HONEST STATUS. At the time of writing this repository is not under version
# control — there is no .git directory — so no workflow here has ever executed,
# including the -race step in pr-go.yml that has been present all along. That is
# the substance of production blocker B1: not a missing configuration, but a
# configuration that has never run. See docs/hardening/RACE_VERIFICATION_REPORT.md.
# =============================================================================
name: hardening

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - "packages/go/**"
      - "services/go/**"
      - "go.work"
      - ".github/workflows/hardening.yml"
  # Nightly, because the race detector finds interleavings by observing them and
  # more executions mean more interleavings. A gate that only runs on changed
  # code never re-examines code that has stopped changing.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: hardening-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches pr-go.yml: a supported release line (see the note there).
  GO_VERSION: "1.26.x"
  GOTOOLCHAIN: "local"
  GOFLAGS: "-mod=readonly"
  # The AI plane. Listed explicitly rather than discovered, because these are
  # the modules Phase 10.5 makes claims about and a silent change to the set
  # would invalidate the claims without failing anything.
  #
  # Phase 12 T3 added the Phase 11 real-time plane (second group). Until then
  # this list held only the eight Phase 10 modules, so the NIGHTLY repeated
  # shuffled race job — the mode most likely to surface interleaving-dependent
  # races — excluded every Phase 11 module, including the voice pipeline, which
  # runs per-turn goroutines and is the most concurrent code in the platform.
  # pr-go.yml covered them per-push via go.work auto-discovery, but pr-go.yml
  # does not run on a schedule, so code that stopped changing stopped being
  # re-examined. Listed in dependency order: telephony → media → audio
  # intelligence → speech → voice.
  #
  # Phase 14 T13 added services/go/voice, the first services/ entry: the service
  # that wires voiceintel into a running process (ADR 0017). It meets the same
  # 60% coverage floor as every other entry; it is last because it depends on
  # the packages above it.
  AI_MODULES: >-
    packages/go/metrics
    packages/go/runtime
    packages/go/conversation
    packages/go/memory
    packages/go/toolruntime
    packages/go/governance
    packages/go/evaluation
    packages/go/evalsubjects
    packages/go/telephony
    packages/go/media
    packages/go/audiointel
    packages/go/audiobridge
    packages/go/speech
    packages/go/voice
    packages/go/intent
    packages/go/voiceintel
    services/go/voice

  # Modules that get the REPEATED SHUFFLED race pass only (-count=5
  # -shuffle=on), not the single pass: pr-go.yml already runs every module
  # once under -race per change, so a single pass here would only repeat it.
  # Kept out of AI_MODULES because AI_MODULES also drives the coverage floor
  # and the benchmarks, whose claims are about the AI plane.
  #
  # The telephony gateway (D8, P1-49 §3.2) holds the single-active-process
  # fence: a heartbeat goroutine, a credential refresh shared by concurrent
  # dials and a clock-bounded ownership check. pr-go.yml runs it under -race
  # once per change, but nothing re-examined it on a schedule or with shuffled
  # repetition. Its real-PostgreSQL tests need a DSN this job does not provide,
  # so here they report SKIP (not PASS); they belong to a database job.
  RACE_EXTRA_MODULES: >-
    services/go/telephony-gateway

jobs:
  # ---------------------------------------------------------------------------
  # Race verification
  # ---------------------------------------------------------------------------
  race:
    name: Race detector (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Two modes because they find different things. A single pass finds
        # races on the paths it happens to take; repeated shuffled runs
        # re-order test execution and re-time goroutines, which is how the
        # interleaving-dependent ones surface.
        mode: [single, repeated]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Confirm cgo is available
        run: |
          set -euo pipefail
          # -race requires cgo. Failing here with a clear message beats failing
          # later with "-race requires cgo; enable cgo by setting CGO_ENABLED=1",
          # which is the exact error that blocked local verification for six
          # phases on a Windows machine with no C toolchain.
          test "$(go env CGO_ENABLED)" = "1" || { echo "::error::CGO_ENABLED is 0; -race cannot run"; exit 1; }
          cc --version | head -1

      - name: Run race detector
        id: race
        run: |
          set -euo pipefail
          mkdir -p race-logs
          if [ "${{ matrix.mode }}" = "repeated" ]; then
            flags="-race -count=5 -shuffle=on -timeout=30m"
          else
            flags="-race -count=1 -timeout=20m"
          fi

          failed=""
          extra=""
          if [ "${{ matrix.mode }}" = "repeated" ]; then extra="${RACE_EXTRA_MODULES}"; fi
          for m in ${AI_MODULES} ${extra}; do
            echo "::group::race ${m} (${{ matrix.mode }})"
            log="race-logs/$(echo "${m}" | tr '/' '_').log"
            # Capture rather than stream-and-discard: a WARNING: DATA RACE block
            # is the artifact somebody needs to read, and scrolling a CI console
            # is not reading it.
            (cd "${m}" && go test ${flags} ./... 2>&1) | tee "${log}" || failed="${failed} ${m}"
            echo "::endgroup::"
          done

          if grep -rl "WARNING: DATA RACE" race-logs/ >/dev/null 2>&1; then
            echo "::error::the race detector reported a data race"
            grep -rn -A 30 "WARNING: DATA RACE" race-logs/ || true
            exit 1
          fi
          if [ -n "${failed}" ]; then
            echo "::error::failing modules under -race:${failed}"
            # Name the KIND of failure per module, so a red run says what to do
            # before anyone opens a log: a timeout and a build break need
            # different people than a failing assertion. The full log is in
            # the race-logs artifact either way.
            {
              echo "### Race detector (${{ matrix.mode }}): failing modules"
              echo "| module | failure | log |"
              echo "|---|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"
            for m in ${failed}; do
              log="race-logs/$(echo "${m}" | tr '/' '_').log"
              if grep -q '^panic: test timed out' "${log}"; then kind="timeout"
              elif grep -qE '\[(build|setup) failed\]' "${log}"; then kind="build failure"
              elif grep -q -e '^--- FAIL' -e '^    --- FAIL' "${log}"; then kind="test failure"
              else kind="unclassified (read the log)"; fi
              echo "::error title=race ${m}::${kind}"
              echo "| ${m} | ${kind} | race-logs-${{ matrix.mode }}/$(basename "${log}") |" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 1
          fi
          echo "clean=true" >> "$GITHUB_OUTPUT"

      - name: Upload race logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-logs-${{ matrix.mode }}
          path: race-logs/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Coverage
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Measure coverage
        run: |
          set -euo pipefail
          mkdir -p coverage
          summary="coverage/summary.txt"
          : > "${summary}"

          # Do not stop at the first failing module. Under `set -e` this loop
          # aborted on the first failure, and because that module is 8th of 14
          # the six Phase 11 modules added in T3 were never measured at all —
          # one known-failing module silently erased coverage reporting for
          # everything after it. The race job and ci.yml's test loop already
          # collect-and-continue for this reason; this now matches them.
          #
          # Nothing is hidden: a failing module is still recorded and still
          # fails the step at the end.
          failed=""
          for m in ${AI_MODULES}; do
            echo "::group::coverage ${m}"
            out="coverage/$(echo "${m}" | tr '/' '_').out"
            if (cd "${m}" && go test -count=1 -covermode=atomic -coverprofile="${GITHUB_WORKSPACE}/${out}" ./...); then
              pct=$(go tool cover -func="${out}" | tail -1 | awk '{print $3}')
              printf '%-34s %s\n' "${m}" "${pct}" | tee -a "${summary}"
            else
              failed="${failed} ${m}"
              echo "::error::${m} tests failed under coverage; no percentage recorded"
            fi
            echo "::endgroup::"
          done

          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "${summary}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${failed}" ]; then
            echo "::error::modules failing under coverage:${failed}"
            exit 1
          fi

      # A floor, not a target. Ratcheting coverage upward turns it into a
      # number people optimise; a floor only catches a module whose tests were
      # deleted or never written.
      #
      # always(), so a module that fails its tests cannot also suppress the
      # floor check for every module that passed.
      - name: Enforce coverage floor
        if: always()
        run: |
          set -euo pipefail
          floor=60
          fail=0
          # always() means this can run after an earlier failure, so the summary
          # may be absent. Missing measurements are not a pass.
          if [ ! -s coverage/summary.txt ]; then
            echo "::error::no coverage was recorded; the floor could not be evaluated"
            exit 1
          fi
          while read -r module pct; do
            value="${pct%\%}"
            if awk "BEGIN{exit !(${value} < ${floor})}"; then
              echo "::error::${module} coverage ${pct} is below the ${floor}% floor"
              fail=1
            fi
          done < coverage/summary.txt
          exit "${fail}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Benchmarks
  # ---------------------------------------------------------------------------
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        run: |
          set -euo pipefail
          mkdir -p bench
          for m in ${AI_MODULES}; do
            echo "::group::bench ${m}"
            out="bench/$(echo "${m}" | tr '/' '_').txt"
            # -benchtime is short on shared runners. These numbers are for
            # trend detection, not for the published figures — a GitHub runner
            # is a noisy neighbour and its absolute timings mean little.
            (cd "${m}" && go test -run '^$' -bench=. -benchmem -benchtime=100ms ./... 2>&1) | tee "${out}" || true
            echo "::endgroup::"
          done

      # Recorded, not gated. A benchmark threshold on a shared runner fails for
      # reasons unrelated to the code, and a gate that fails for unrelated
      # reasons is a gate people learn to re-run until it passes.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks
          path: bench/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Cross-subsystem checks
  # ---------------------------------------------------------------------------
  platform-verification:
    name: Platform verification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The evaluation core must not import anything it evaluates. This is the
      # architecture's central claim and it is one command to check, so it is
      # checked on every run rather than asserted in a document.
      - name: Verify the evaluation core imports nothing it evaluates
        working-directory: packages/go/evaluation
        run: |
          set -euo pipefail
          deps=$(go list -deps ./... | grep callscreen | grep -v '/evaluation$' || true)
          expected="github.com/callscreen/callscreen-platform/packages/go/metrics
          github.com/callscreen/callscreen-platform/packages/go/runtime"
          for d in ${deps}; do
            case "${d}" in
              */packages/go/runtime|*/packages/go/metrics) ;;
              *) echo "::error::evaluation core depends on ${d}, which it is supposed to evaluate"; exit 1 ;;
            esac
          done
          echo "evaluation core dependencies: ${deps}"

      - name: Cross-subsystem observability
        working-directory: packages/go/evalsubjects
        run: go test -count=1 -run TestObservability -v ./...

      - name: Final platform verification
        working-directory: packages/go/evalsubjects
        run: go test -count=1 -run TestVerification -v ./...

  # ---------------------------------------------------------------------------
  # Release gate
  # ---------------------------------------------------------------------------
  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    needs: [race, coverage, benchmarks, platform-verification]
    # Runs even when a dependency failed, so the gate reports WHICH gate failed
    # rather than being skipped and leaving a green-looking summary.
    if: always()
    timeout-minutes: 5
    steps:
      - name: Evaluate gates
        run: |
          set -euo pipefail
          race='${{ needs.race.result }}'
          coverage='${{ needs.coverage.result }}'
          bench='${{ needs.benchmarks.result }}'
          platform='${{ needs.platform-verification.result }}'

          printf '%-24s %s\n' "race detector" "${race}" \
                              "coverage" "${coverage}" \
                              "benchmarks" "${bench}" \
                              "platform verification" "${platform}" | tee gate.txt

          {
            echo "### Release gate"
            echo '```'
            cat gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Benchmarks are recorded, not gated — see the note in that job.
          # Everything else fails closed: an inconclusive result is a failure,
          # not a pass, which is the same default-deny stance the governance
          # engine takes.
          for result in "${race}" "${coverage}" "${platform}"; do
            case "${result}" in
              success) ;;
              *) echo "::error::release gate failed"; exit 1 ;;
            esac
          done
          echo "release gate: PASS"
