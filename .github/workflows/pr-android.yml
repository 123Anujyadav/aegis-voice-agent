# =============================================================================
# Android build and unit tests.
#
# Nothing built or tested the Android app on a pull request: only the Gradle
# wrapper was verified (pr-android-wrapper.yml). The app has not changed since
# the repository was initialised, so this workflow is the evidence the next
# Android milestone (the client's auth and network layers) needs before any of
# it is written.
#
# What it runs: the debug build of every module, the JVM unit tests, and the
# minified staging build (release's R8 configuration, debug-signed). Release
# builds need signing material, and instrumented tests need a device; neither
# runs here.
#
# Toolchain: the JDK and the Android SDK preinstalled on the runner image. No
# setup action is used, so no third-party action runs with the checkout.
# Gradle executes the committed wrapper, whose jar and distribution
# pr-android-wrapper.yml verifies against Gradle's published checksums whenever
# they change.
# =============================================================================
name: pr-android

on:
  push:
    branches: [main]
    paths:
      - "tools/scripts/android-release-bundle.sh"
      - "android/**"
      - "design/tokens/**"
      - ".github/workflows/pr-android.yml"
  pull_request:
    paths:
      - "tools/scripts/android-release-bundle.sh"
      - "android/**"
      - "design/tokens/**"
      - ".github/workflows/pr-android.yml"
  merge_group:

concurrency:
  group: pr-android-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android debug build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Use the runner's JDK 17 and Android SDK
        run: |
          test -n "${JAVA_HOME_17_X64:-}" || { echo "::error::JDK 17 is not preinstalled on this image"; exit 1; }
          test -d "${ANDROID_HOME:-}" || { echo "::error::the Android SDK is not preinstalled on this image"; exit 1; }
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"

      - name: Build every module (debug)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: JVM unit tests (debug)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build-logic unit tests
        working-directory: android
        run: |
          ./gradlew --no-daemon --stacktrace -p build-logic :convention:test
          # A test task that discovers no tests still passes in Gradle 8, so
          # require each suite's JUnit report with at least one test.
          for suite in ReleaseVersionTest ReleaseSigningTest; do
            report=build-logic/convention/build/test-results/test/TEST-$suite.xml
            grep -Eq '<testsuite [^>]*tests="[1-9][0-9]*"' "$report" || { echo "::error::$suite did not run ($report)"; exit 1; }
          done

      # The release version comes from CS_VERSION_CODE. A value that is set but
      # invalid must stop the build, not quietly ship the developer default 1.
      - name: An invalid CS_VERSION_CODE fails the build
        working-directory: android
        run: |
          log="$RUNNER_TEMP/invalid-version.log"
          if CS_VERSION_CODE=not-a-number ./gradlew --no-daemon :app:help > "$log" 2>&1; then
            echo "::error::the build accepted CS_VERSION_CODE=not-a-number"; exit 1
          fi
          grep -q "CS_VERSION_CODE must be a whole number" "$log" || { cat "$log"; echo "::error::the build failed, but not on CS_VERSION_CODE"; exit 1; }

      # staging inherits release's R8 minification and resource shrinking but
      # is signed with the debug key, so it needs no release secrets. Building
      # it is what catches R8-only defects (missing keep rules, stripped
      # classes) before a release build ever runs.
      - name: Minified staging build (R8, debug-signed)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleStaging

      # A green staging build alone does not prove R8 ran: when the staging
      # build type silently lost release's minification, assembleStaging still
      # passed. R8 writes the mapping file; its absence fails the job.
      - name: R8 actually minified the staging build
        working-directory: android
        run: |
          mapping=app/build/outputs/mapping/staging/mapping.txt
          test -s "$mapping" || { echo "::error::$mapping is missing or empty: the staging build was not minified by R8"; exit 1; }

      # The release signing path, through the SAME script the release workflow
      # runs (tools/scripts/android-release-bundle.sh), with a THROWAWAY key
      # generated here and deleted with the job's temp directory. It is never
      # the real upload key, which only the release workflow's protected
      # Environment holds. The script builds :app:bundleRelease and fails
      # unless the bundle's signer is exactly this key's certificate.
      - name: Release bundle is signed with the upload key (throwaway key, release script)
        run: |
          dir="$RUNNER_TEMP/throwaway-upload-key"
          mkdir -p "$dir"
          trap 'rm -rf "$dir"' EXIT
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::$pass"
          keytool -genkeypair -noprompt -keystore "$dir/upload.p12" -storetype PKCS12 \
            -storepass "$pass" -keypass "$pass" -alias upload -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=Throwaway CI upload key"
          UPLOAD_KEYSTORE_BASE64="$(base64 -w0 "$dir/upload.p12")" \
            CS_UPLOAD_KEYSTORE_PASSWORD="$pass" CS_UPLOAD_KEY_ALIAS=upload CS_UPLOAD_KEY_PASSWORD="$pass" \
            CS_VERSION_CODE=1 CS_VERSION_NAME=0.0.0-ci \
            bash tools/scripts/android-release-bundle.sh

      # A release with only some CS_UPLOAD_* variables set must fail, naming
      # the missing variables, rather than quietly building an unsigned bundle.
      - name: A partial upload-key configuration fails the build
        working-directory: android
        run: |
          log="$RUNNER_TEMP/partial-signing.log"
          if CS_UPLOAD_KEY_ALIAS=upload ./gradlew --no-daemon :app:help > "$log" 2>&1; then
            echo "::error::the build accepted a partial upload-key configuration"; exit 1
          fi
          grep -q "Release signing needs all of" "$log" || { cat "$log"; echo "::error::the build failed, but not on the upload-key configuration"; exit 1; }
