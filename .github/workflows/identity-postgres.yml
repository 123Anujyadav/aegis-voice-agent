# =============================================================================
# identity and edge-api against real PostgreSQL, under -race (ADR-0029).
#
# pr-go runs these modules' OFFLINE tests under -race but sets no test DSN, so
# their real-PostgreSQL tests skip there: identity's repository, replay,
# migration, housekeeping and lifecycle suites, edge-api's shared replay store
# and grants suites, and the end-to-end test in which a token identity issues
# is admitted by edge-api. This job runs both suites against a THROWAWAY
# PostgreSQL container started by tools/scripts/identity-postgres-tests.sh,
# plus pgshared's real verify-full TLS suite against a second, TLS-serving
# throwaway container whose certificates the script generates for the run:
#
#   * one official image, pinned by immutable digest (below), pulled here; the
#     script itself never pulls (--pull never);
#   * bound to 127.0.0.1 on a random port, with a random one-off password
#     generated by the script, and removed on exit even on failure;
#   * an unexpected skipped test FAILS the job, so a test that silently did not
#     run cannot pass as green (the one allowed skip is documented in the
#     script).
#
# No CI secret and no external endpoint is used: the only credential is
# generated inside the job and dies with it.
#
# Kept as its own workflow so pr-go.yml is not edited, as gateway-postgres.yml.
# =============================================================================
name: identity-postgres

on:
  push:
    branches: [main]
    paths:
      - "services/go/identity/**"
      - "services/go/edge-api/**"
      - "packages/go/accesstoken/**"
      - "packages/go/dpop/**"
      - "packages/go/pgshared/**"
      - "packages/go/platform/**"
      - "packages/go/middleware/**"
      - "packages/go/telemetry/**"
      - "go.work"
      - "go.work.sum"
      - "tools/scripts/identity-postgres-tests.sh"
      - ".github/workflows/identity-postgres.yml"
  pull_request:
    paths:
      - "services/go/identity/**"
      - "services/go/edge-api/**"
      - "packages/go/accesstoken/**"
      - "packages/go/dpop/**"
      - "packages/go/pgshared/**"
      - "packages/go/platform/**"
      - "packages/go/middleware/**"
      - "packages/go/telemetry/**"
      - "go.work"
      - "go.work.sum"
      - "tools/scripts/identity-postgres-tests.sh"
      - ".github/workflows/identity-postgres.yml"
  workflow_dispatch:

concurrency:
  group: identity-postgres-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same toolchain policy as pr-go.yml.
  GO_VERSION: "1.26.10"
  GOTOOLCHAIN: "local"
  GOFLAGS: "-mod=readonly"
  # postgres:17.2-alpine, pinned by OCI index digest: the same image as
  # gateway-postgres.yml, and the one these suites were verified against
  # locally.
  POSTGRES_IMAGE: "docker.io/library/postgres@sha256:7e5df973a74872482e320dcbdeb055e178d6f42de0558b083892c50cda833c96"

jobs:
  identity-postgres:
    name: identity and edge-api (real PostgreSQL, -race)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/go/identity/go.sum
            services/go/edge-api/go.sum

      # -race needs cgo and a C compiler. Fail loudly if the runner lacks one,
      # rather than letting a race run degrade into something else.
      - name: Check race-detector prerequisites
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          gcc --version | head -n1
          test "$(go env CGO_ENABLED)" = "1"

      - name: Pull the pinned PostgreSQL image
        run: docker pull --platform linux/amd64 "$POSTGRES_IMAGE"

      - name: Identity and edge-api suites against throwaway PostgreSQL, under -race
        env:
          CGO_ENABLED: "1"
          GO_TEST_FLAGS: "-race"
        run: bash tools/scripts/identity-postgres-tests.sh

      # Belt and braces: the script's trap removes its container; this proves
      # it, and cleans up if the job was interrupted before the trap ran.
      - name: Verify container cleanup
        if: ${{ always() }}
        run: |
          left="$(docker ps -aq --filter name=cs-idpg-)"
          if [ -n "$left" ]; then
            # One container ID per word: the split is intended.
            # shellcheck disable=SC2086
            docker rm -f $left >/dev/null
            echo "::error::the throwaway PostgreSQL container was left behind and has been removed"
            exit 1
          fi
