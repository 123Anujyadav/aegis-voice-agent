# =============================================================================
# evalstore against real PostgreSQL, under -race
# (docs/phase15/READINESS_AUDIT.md §10.18.3).
#
# pr-go runs evalstore's tests under -race but sets no AEGIS_EVALSTORE_DSN, so
# 14 of its 15 tests skip there: the evaluation-record store's migrations,
# writes, idempotency, concurrency and reporting against a real transaction
# manager. This job runs the suite against a THROWAWAY PostgreSQL container
# started by tools/scripts/evalstore-postgres-tests.sh:
#
#   * one official image, pinned by immutable digest (below), pulled here; the
#     script itself never pulls (--pull never);
#   * bound to 127.0.0.1 on a random port, with a random one-off password
#     generated by the script, and removed on exit even on failure;
#   * a skipped test FAILS the job, so a test that silently did not run cannot
#     pass as green.
#
# No CI secret and no external endpoint is used: the only credential is
# generated inside the job and dies with it.
#
# Kept as its own workflow so pr-go.yml is not edited, and kept apart from
# gateway-postgres.yml (D8 evidence, unedited). It is NOT a required check.
# =============================================================================
name: evalstore-postgres

on:
  push:
    branches: [main]
    paths:
      - "packages/go/evalstore/**"
      - "packages/go/evaluation/**"
      - "packages/go/runtime/**"
      - "go.work"
      - "go.work.sum"
      - "tools/scripts/evalstore-postgres-tests.sh"
      - ".github/workflows/evalstore-postgres.yml"
  pull_request:
    paths:
      - "packages/go/evalstore/**"
      - "packages/go/evaluation/**"
      - "packages/go/runtime/**"
      - "go.work"
      - "go.work.sum"
      - "tools/scripts/evalstore-postgres-tests.sh"
      - ".github/workflows/evalstore-postgres.yml"
  workflow_dispatch:

concurrency:
  group: evalstore-postgres-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same toolchain policy as pr-go.yml.
  GO_VERSION: "1.26.10"
  GOTOOLCHAIN: "local"
  GOFLAGS: "-mod=readonly"
  # postgres:17.2-alpine, pinned by OCI index digest: the same image as
  # gateway-postgres.yml and identity-postgres.yml.
  POSTGRES_IMAGE: "docker.io/library/postgres@sha256:7e5df973a74872482e320dcbdeb055e178d6f42de0558b083892c50cda833c96"

jobs:
  evalstore-postgres:
    name: evalstore (real PostgreSQL, -race)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: packages/go/evalstore/go.sum

      # -race needs cgo and a C compiler. Fail loudly if the runner lacks one,
      # rather than letting a race run degrade into something else.
      - name: Check race-detector prerequisites
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          gcc --version | head -n1
          test "$(go env CGO_ENABLED)" = "1"

      - name: Pull the pinned PostgreSQL image
        run: docker pull --platform linux/amd64 "$POSTGRES_IMAGE"

      - name: evalstore suite against throwaway PostgreSQL, under -race
        env:
          CGO_ENABLED: "1"
          GO_TEST_FLAGS: "-race"
        run: bash tools/scripts/evalstore-postgres-tests.sh

      # Belt and braces: the script's trap removes its container; this proves
      # it, and cleans up if the job was interrupted before the trap ran.
      - name: Verify container cleanup
        if: ${{ always() }}
        run: |
          left="$(docker ps -aq --filter name=cs-evpg-)"
          if [ -n "$left" ]; then
            # One container ID per word: the split is intended.
            # shellcheck disable=SC2086
            docker rm -f $left >/dev/null
            echo "::error::the throwaway PostgreSQL container was left behind and has been removed"
            exit 1
          fi
