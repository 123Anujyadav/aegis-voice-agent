# =============================================================================
# Aegis AI CI Pipeline — repository-wide smoke gate.
#
# NOTE ON THE `./...` PATTERN. Earlier revisions of this file ran
# `go build ./...` and `go test ./...` from the repository root. That fails:
# the root has no go.mod, so it is not inside any module, and Go rejects the
# pattern with
#
#   directory prefix . does not contain modules listed in go.work
#
# This is correct Go behaviour in a workspace, not a misconfiguration. Every Go
# step therefore iterates the module list, exactly as pr-go.yml does. See
# docs/hardening/CICD_READINESS_REPORT.md.
#
# The deep gate is pr-go.yml — per-module matrix, race detection, lint,
# formatting and vulnerability scanning. This file is the fast whole-repository
# check that runs on pushes to the long-lived branches.
# =============================================================================
name: Aegis AI CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must be at least the highest `go` directive in go.work. The AI-plane
  # modules declare go 1.25.0.
  GO_VERSION: "1.25.x"
  GOTOOLCHAIN: "local"
  GOFLAGS: "-mod=readonly"

jobs:
  backend-test:
    name: Build & Test Backend Foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # `go work sync` takes NO flags. The previous `-n` was rejected outright
      # ("flag provided but not defined: -n", exit 2), so this gate failed on
      # every run while reporting a stale go.work.sum that was never tested —
      # and because it failed, the build and test steps below never executed.
      # Nor does -mod=readonly turn sync into a dry run; sync ignores it.
      #
      # A staleness diff on go.work.sum is ALSO not possible here: that file is
      # gitignored (.gitignore:69), so it never reaches CI and there is nothing
      # committed to compare a freshly synced copy against. A first attempt at
      # this gate died on exactly that — `cp: cannot stat 'go.work.sum'`.
      #
      # What is genuinely verifiable is that the workspace build list RESOLVES
      # across every module: `go work sync` performs Minimal Version Selection
      # over all 40 modules and fails if they cannot agree. The manifests are
      # restored afterwards so later steps build exactly what was committed.
      #
      # go.work's use-block ordering is normalised by sync and is reported as a
      # notice rather than gated — it is cosmetic and unrelated to resolution.
      - name: Verify the Go workspace resolves
        run: |
          set -euo pipefail
          cp go.work go.work.snapshot
          go work sync
          if ! diff -u go.work.snapshot go.work; then
            echo "::notice::go work sync normalised go.work use-block ordering (cosmetic, not gated)"
          fi
          mv go.work.snapshot go.work
          if [ -f go.work.sum ]; then
            echo "::notice::go.work.sum present; it is gitignored so no staleness comparison is possible"
          fi

      - name: Build every module
        run: |
          set -euo pipefail
          # go.work is the single source of truth for what exists, so a new
          # module is covered the day it is added rather than the day somebody
          # remembers to edit this file.
          modules=$(grep -oE '\./[a-z0-9/_-]+' go.work | sed 's|^\./||')
          for m in ${modules}; do
            echo "::group::build ${m}"
            (cd "${m}" && go build ./...)
            echo "::endgroup::"
          done

      - name: Test every module
        run: |
          set -euo pipefail
          modules=$(grep -oE '\./[a-z0-9/_-]+' go.work | sed 's|^\./||')
          failed=""
          for m in ${modules}; do
            echo "::group::test ${m}"
            # Do not stop at the first failing module: seeing every failure in
            # one run is worth more than failing fast on the first.
            (cd "${m}" && go test -count=1 ./...) || failed="${failed} ${m}"
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "::error::failing modules:${failed}"
            exit 1
          fi
