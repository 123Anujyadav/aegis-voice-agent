# =============================================================================
# telephony-gateway against real PostgreSQL, under -race (D8; P1-49 §3.3).
#
# pr-go runs the gateway's OFFLINE tests under -race but sets no test DSN, so
# its real-PostgreSQL tests skip there: the fence's ownership, overlap, audit,
# credential-rotation and phase-timing suites, plus the two-binary startup
# test. This job runs the whole gateway suite against a THROWAWAY PostgreSQL
# container started by tools/scripts/gateway-postgres-tests.sh:
#
#   * one official image, pinned by immutable digest (below), pulled here; the
#     script itself never pulls (--pull never);
#   * bound to 127.0.0.1 on a random port, with a random one-off password
#     generated by the script, and removed on exit even on failure;
#   * a skipped test FAILS the job, so a test that silently did not run cannot
#     pass as green.
#
# No CI secret and no external endpoint is used: the only credential is
# generated inside the job and dies with it.
#
# Kept as its own workflow so pr-go.yml is not edited.
# =============================================================================
name: gateway-postgres

on:
  push:
    branches: [main]
    paths:
      - "services/go/telephony-gateway/**"
      - "packages/go/platform/**"
      - "go.work"
      - "go.work.sum"
      - "tools/scripts/gateway-postgres-tests.sh"
      - ".github/workflows/gateway-postgres.yml"
  pull_request:
    paths:
      - "services/go/telephony-gateway/**"
      - "packages/go/platform/**"
      - "go.work"
      - "go.work.sum"
      - "tools/scripts/gateway-postgres-tests.sh"
      - ".github/workflows/gateway-postgres.yml"
  workflow_dispatch:

concurrency:
  group: gateway-postgres-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same toolchain policy as pr-go.yml.
  GO_VERSION: "1.26.10"
  GOTOOLCHAIN: "local"
  GOFLAGS: "-mod=readonly"
  # postgres:17.2-alpine, pinned by OCI index digest: the same image the
  # gateway's real-PostgreSQL suites were verified against locally (P1-40,
  # P1-41).
  POSTGRES_IMAGE: "docker.io/library/postgres@sha256:7e5df973a74872482e320dcbdeb055e178d6f42de0558b083892c50cda833c96"

jobs:
  gateway-postgres:
    name: telephony-gateway (real PostgreSQL, -race)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go/telephony-gateway/go.sum

      # -race needs cgo and a C compiler. Fail loudly if the runner lacks one,
      # rather than letting a race run degrade into something else.
      - name: Check race-detector prerequisites
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          gcc --version | head -n1
          test "$(go env CGO_ENABLED)" = "1"

      - name: Pull the pinned PostgreSQL image
        run: docker pull --platform linux/amd64 "$POSTGRES_IMAGE"

      - name: Gateway suite against throwaway PostgreSQL, under -race
        env:
          CGO_ENABLED: "1"
          GO_TEST_FLAGS: "-race"
        run: bash tools/scripts/gateway-postgres-tests.sh

      # Belt and braces: the script's trap removes its container; this proves
      # it, and cleans up if the job was interrupted before the trap ran.
      - name: Verify container cleanup
        if: ${{ always() }}
        run: |
          left="$(docker ps -aq --filter name=cs-gwpg-)"
          if [ -n "$left" ]; then
            docker rm -f $left >/dev/null
            echo "::error::the throwaway PostgreSQL container was left behind and has been removed"
            exit 1
          fi
