# =============================================================================
# speech-google: CI for packages/go/speechproviders/google, standalone.
#
# Why this is its own workflow: the Google adapter is deliberately NOT in
# go.work (ADR-0034, containment). Workspace builds share one version
# selection, and adding it would raise shared dependencies in other binaries,
# among them identity's golang.org/x/oauth2 and cloud.google.com/go/compute
# (docs/hardening/DEPENDENCY_AUDIT.md §15). pr-go discovers modules from
# go.work, so it does not test this module; this workflow does, with
# GOWORK=off and the same pinned actions and tool versions as pr-go.
# pr-go's gofumpt check already covers every file under packages/go.
# =============================================================================
name: speech-google

on:
  push:
    branches: [main]
    paths:
      - "packages/go/speechproviders/google/**"
      - "packages/go/speech/**"
      - "packages/go/media/**"
      - "packages/go/metrics/**"
      - "packages/go/runtime/**"
      - "packages/go/telephony/**"
      - "packages/go/providerconformance/**"
      - ".golangci.yml"
      - ".github/workflows/speech-google.yml"
  pull_request:
    paths:
      - "packages/go/speechproviders/google/**"
      - "packages/go/speech/**"
      - "packages/go/media/**"
      - "packages/go/metrics/**"
      - "packages/go/runtime/**"
      - "packages/go/telephony/**"
      - "packages/go/providerconformance/**"
      - ".golangci.yml"
      - ".github/workflows/speech-google.yml"

concurrency:
  group: speech-google-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Kept equal to GO_VERSION in pr-go.yml (and the other Go workflows).
  GO_VERSION: "1.26.11"
  GOTOOLCHAIN: "local"
  GOFLAGS: "-mod=readonly"
  # The point of this workflow: the module is built on its own go.mod.
  GOWORK: "off"

jobs:
  google:
    name: packages/go/speechproviders/google (standalone)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/go/speechproviders/google
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: packages/go/speechproviders/google/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detection
        run: go test -race -count=1 ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        run: golangci-lint run --timeout=10m

      - name: Scan for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
