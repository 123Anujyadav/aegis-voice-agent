# =============================================================================
# Telephony integration gate — real PostgreSQL and real Redis, under -race.
# Phase 19 P1-17.
#
# Runs the opt-in integration suites of packages/go/telephonystore (carrier
# call-ID bindings) and packages/go/telephonyredis (callback deduplication)
# against THROWAWAY containers started by tools/scripts/telephony-integration.sh:
#
#   * images pinned by immutable digest (below), pulled explicitly here; the
#     script itself never pulls (--pull never);
#   * each container bound to 127.0.0.1 on a random port, with a random one-off
#     password generated by the script, and removed on exit even on failure;
#   * credentials reach the tests through the environment only, never printed;
#   * tests use random per-test schemas / key prefixes; nothing is flushed;
#   * REQUIRE_ALL=1: a suite that cannot run FAILS this job — never a skip.
#
# No CI secret and no production endpoint is used: every credential is
# generated inside the job and dies with it.
#
# Kept as its own workflow so the existing pr-go.yml (which already runs the
# OFFLINE tests of every go.work module under -race) is not edited.
# =============================================================================
name: telephony-integration

on:
  push:
    # ci/telephony-integration/** lets a dedicated branch run this gate on its
    # own: no other workflow in the repository triggers on such a branch, and a
    # workflow_dispatch run is only possible once this file is on the default
    # branch. (P1-18)
    branches: [main, "ci/telephony-integration/**"]
    paths:
      - "packages/go/telephony/**"
      - "packages/go/telephonystore/**"
      - "packages/go/telephonyredis/**"
      - "packages/go/metrics/**"
      - "packages/go/runtime/**"
      - "tools/scripts/telephony-integration.sh"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/telephony-integration.yml"
  pull_request:
    paths:
      - "packages/go/telephony/**"
      - "packages/go/telephonystore/**"
      - "packages/go/telephonyredis/**"
      - "packages/go/metrics/**"
      - "packages/go/runtime/**"
      - "tools/scripts/telephony-integration.sh"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/telephony-integration.yml"
  workflow_dispatch:

concurrency:
  group: telephony-integration-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same toolchain policy as pr-go.yml.
  GO_VERSION: "1.25.x"
  GOTOOLCHAIN: "local"
  GOFLAGS: "-mod=readonly"
  # Official images, pinned by OCI index digest (verified in P1-15/P1-16):
  #   postgres:17.2-alpine  (PG_VERSION=17.2)
  #   redis:7.4.2-alpine    (REDIS_VERSION=7.4.2)
  POSTGRES_IMAGE: "docker.io/library/postgres@sha256:7e5df973a74872482e320dcbdeb055e178d6f42de0558b083892c50cda833c96"
  REDIS_IMAGE: "docker.io/library/redis@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952"

jobs:
  integration:
    name: telephony integration (real PostgreSQL + Redis, -race)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: packages/go/telephonystore/go.sum

      # The script runs `go test` with GOPROXY=off, so every module the suites
      # need must already be in the module cache.
      - name: Download modules
        run: |
          set -euo pipefail
          for m in packages/go/telephony packages/go/telephonystore packages/go/telephonyredis; do
            (cd "$m" && go mod download)
          done

      # -race needs cgo and a C compiler. Fail loudly if the runner lacks one,
      # rather than letting a race run degrade into something else.
      - name: Check race-detector prerequisites
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          gcc --version | head -n1
          test "$(go env CGO_ENABLED)" = "1"

      - name: Pull pinned service images
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$POSTGRES_IMAGE"
          docker pull --platform linux/amd64 "$REDIS_IMAGE"

      - name: Integration suites under -race
        env:
          CGO_ENABLED: "1"
          GO_TEST_FLAGS: "-race"
          REQUIRE_ALL: "1"
        run: bash tools/scripts/telephony-integration.sh

      # Belt and braces: the script's trap removes its containers; this proves
      # it, and cleans up if the job was interrupted before the trap ran.
      - name: Verify container cleanup
        if: ${{ always() }}
        run: |
          left="$(docker ps -aq --filter name=cs-p115)"
          if [ -n "$left" ]; then
            docker rm -f $left >/dev/null
            echo "::error::integration containers were left behind and have been removed"
            exit 1
          fi
