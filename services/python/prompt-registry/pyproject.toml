# =============================================================================
# prompt-registry
#
# Versioned prompt storage, serving prompts as data rather than code.
#
# Declares only what it imports, so its container image carries only its own
# dependency closure (Phase 1 §13). Development tooling is inherited from the
# workspace root at services/python/pyproject.toml.
# =============================================================================

[project]
name = "prompt-registry"
version = "0.1.0"
description = "Versioned prompt storage, serving prompts as data rather than code."
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "callscreen-platform-py",
]

[project.scripts]
prompt-registry = "prompt_registry.__main__:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_registry"]
