# =============================================================================
# Gradle wrapper configuration.
#
# The wrapper is what makes the build reproducible across machines: every
# engineer and every CI runner uses the exact Gradle version pinned here,
# regardless of what is installed locally. Running `gradle` directly instead of
# `./gradlew` is a build-reproducibility violation.
#
# distributionSha256Sum is mandatory, not optional. Without it the wrapper will
# execute whatever it downloads from distributionUrl, which makes the build a
# remote code execution vector if that URL is ever compromised or intercepted.
# This is the single most important line in the file.
# =============================================================================
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.12-bin.zip
distributionSha256Sum=7a00d51fb93147819aab76024feece20b6b84e420694101f276be952e08bef03
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Validate the wrapper jar's own integrity on every run.
networkTimeout=60000
validateDistributionUrl=true
