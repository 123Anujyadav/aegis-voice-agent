# =============================================================================
# Gradle build properties.
#
# These settings are the difference between a 40-second incremental build and a
# four-minute one. Build speed is a first-class engineering concern: Phase 1 §16
# budgets PR feedback at under ten minutes, and Gradle configuration time is the
# largest single contributor on the Android side.
# =============================================================================

# --- JVM -----------------------------------------------------------------------
# 4 GB heap: enough for AGP + KSP + Compose compilation on a 20-module build
# without GC thrash. Metaspace is capped explicitly because the default is
# unlimited, and an unbounded Metaspace on a long-lived daemon eventually
# consumes the machine.
# UTF-8 is forced because the default charset on a Windows JVM is the system
# codepage, which corrupts non-ASCII strings in resources at build time.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Build performance ---------------------------------------------------------
# Run independent module tasks concurrently.
org.gradle.parallel=true

# Reuse task outputs across builds and, in CI, across machines via the remote
# cache. This is the single highest-leverage setting in this file.
org.gradle.caching=true

# Skip configuring modules that the requested task does not need. On a 20-module
# build this removes most of the configuration phase for a single-module change.
org.gradle.configureondemand=true

# Configuration cache: serialises the configured task graph and replays it,
# eliminating the configuration phase entirely on repeat builds.
org.gradle.configuration-cache=true
# Warn rather than fail on a configuration-cache problem so that a third-party
# plugin lagging on support degrades performance instead of blocking the build.
org.gradle.configuration-cache.problems=warn

# Keep the daemon alive between builds; a cold JVM start costs seconds per build.
org.gradle.daemon=true

# --- AndroidX ------------------------------------------------------------------
android.useAndroidX=true

# Jetifier rewrites legacy support-library references at build time and is a
# significant build-time cost. Disabled: no dependency in the catalog needs it,
# and enabling it "just in case" is how it silently stays on forever.
android.enableJetifier=false

# --- Build features defaults ---------------------------------------------------
# BuildConfig, resource values and shaders are opt-in per module via the
# convention plugins. Disabling them globally means a module that does not need
# a generated BuildConfig class does not pay to generate one.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Non-transitive R classes: a module's R class contains only its own resources,
# not those of every dependency. This dramatically shrinks R classes and is a
# prerequisite for effective resource shrinking in the release build.
android.nonTransitiveRClass=true

# --- Kotlin ---------------------------------------------------------------------
kotlin.code.style=official

# Run Kotlin compilation inside the Gradle daemon rather than spawning a
# separate compiler daemon. One fewer JVM to start and to keep resident.
kotlin.compiler.execution.strategy=in-process

# Incremental compilation for Kotlin and for KSP-generated sources.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true

# --- Suppress noisy, non-actionable warnings ------------------------------------
# AGP warns whenever compileSdk is newer than the version it was tested against.
# We deliberately compile against the newest stable SDK (see libs.versions.toml)
# so this warning is expected and would otherwise train the team to ignore
# Gradle warnings generally.
android.suppressUnsupportedCompileSdk=35
