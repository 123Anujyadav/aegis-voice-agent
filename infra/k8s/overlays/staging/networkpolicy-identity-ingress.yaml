# DRAFT for gate A5 approval (ADR-0027). Not applied; nothing is deployed.
#
# Who may reach identity:
#   - the ingress controller's namespace, on the application port (8080) only;
#   - the kubelet, on the health port (8081) only, for /readyz and /healthz.
#
# The ingress controller is not chosen (the Ingress itself waits for B3/B4).
# If it is the AWS Load Balancer Controller with IP targets, the ALB connects
# to the pods directly, so SRE replaces the namespaceSelector peer with an
# ipBlock of the ALB's subnets.
#
# Some CNIs always admit traffic from the pod's own node (and so the kubelet's
# probes); others do not. The node-subnet rule makes the probes work either
# way; SRE removes it if the chosen CNI does not need it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: identity
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <INGRESS_CONTROLLER_NAMESPACE>
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - ipBlock:
            cidr: <NODE_SUBNET_CIDR>
      ports:
        - protocol: TCP
          port: 8081
