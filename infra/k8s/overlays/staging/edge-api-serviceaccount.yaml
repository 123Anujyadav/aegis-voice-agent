# DRAFT for gate A5 approval (ADR-0027). Not applied; nothing is deployed.
#
# edge-api's workload identity. ADR-0008 requires IRSA for every workload and
# no static cloud credentials. edge-api makes no AWS API call today (its go.mod
# has no AWS SDK; its secrets arrive as files through the External Secrets
# Operator), so the IAM role named here should carry NO permissions until a
# feature needs one. It must be a different role from identity's.
#
# automountServiceAccountToken is false: edge-api never calls the Kubernetes
# API, and IRSA's projected token is injected by the EKS pod identity webhook
# independently of this setting.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE>
automountServiceAccountToken: false
