# DRAFT for gate A5 approval (ADR-0027). Not applied; nothing is deployed.
#
# The database's CA bundle (INTERNAL-TESTING-SETUP B2, ADR-0029). Outside an
# explicit `development`, both services refuse any connection string that is
# not sslmode=verify-full with an explicit, absolute, readable sslrootcert file
# (packages/go/pgshared/tls.go); sslrootcert=system is refused.
#
# Both Deployments and the migrate Job mount this Secret at /etc/lily/db-ca/,
# so every DSN names sslrootcert=/etc/lily/db-ca/ca-bundle.pem.
#
# A CA bundle is public, not confidential. It is delivered through the same
# operator so that its source is the same IAM-scoped store and nobody can
# substitute a CA by editing a ConfigMap in the namespace.
#
# API version: see identity-externalsecret.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-ca-bundle
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-ap-south-1
  target:
    name: db-ca-bundle
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ca-bundle.pem
      remoteRef:
        key: <PLACEHOLDER>/staging/database/ca-bundle
        decodingStrategy: None
