# DRAFT for gate A5 approval (ADR-0027). Not applied; nothing is deployed.
#
# identity's three secret files (INTERNAL-TESTING-SETUP B2, B5, B6; C3),
# delivered by the External Secrets Operator from AWS Secrets Manager in
# ap-south-1 into the Secret `identity-secrets`. SECURITY.md: secrets reach
# Kubernetes as mounted FILES, never as environment values or a ConfigMap.
# The Deployment and the migrate Job mount this Secret read-only.
#
# Each key becomes one file under /etc/lily/secrets/ in the pod:
#   access-token-private-key.pem  Ed25519 PKCS#8 PEM "PRIVATE KEY" (B5), <= 16 KiB
#   hmac-secret-key               >= 32 random bytes, used EXACTLY as stored
#                                 (never trimmed), stable across restarts and
#                                 replicas (B6). Store it so that ESO does not
#                                 transform it (decodingStrategy None).
#   database-dsn                  one line: a PostgreSQL connection string with
#                                 sslmode=verify-full and
#                                 sslrootcert=/etc/lily/db-ca/ca-bundle.pem (B2,
#                                 ADR-0029). It carries the password, so it is
#                                 secret as a whole.
#
# identity reads the keys at startup only. A changed value takes effect at the
# next rollout, never by refresh (runbook access-token-signing-key-rotation.md).
#
# The API version follows the request for this draft. Newer ESO releases serve
# external-secrets.io/v1 and deprecate v1beta1; SRE sets the version the
# installed operator serves.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: identity-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-ap-south-1
  target:
    name: identity-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: access-token-private-key.pem
      remoteRef:
        key: <PLACEHOLDER>/staging/identity/access-token-private-key
        decodingStrategy: None
    - secretKey: hmac-secret-key
      remoteRef:
        key: <PLACEHOLDER>/staging/identity/hmac-secret-key
        decodingStrategy: None
    - secretKey: database-dsn
      remoteRef:
        key: <PLACEHOLDER>/staging/identity/database-dsn
        decodingStrategy: None
