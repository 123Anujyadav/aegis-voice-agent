# DRAFT for gate A5 approval (ADR-0027). Not applied; nothing is deployed.
#
# identity's workload identity. ADR-0008 requires IRSA for every workload and
# no static cloud credentials. identity makes no AWS API call today (its
# go.mod has no AWS SDK; its secrets arrive as files through the External
# Secrets Operator, which authenticates with its own identity), so the IAM
# role named here should carry NO permissions until a feature needs one.
#
# automountServiceAccountToken is false: identity never calls the Kubernetes
# API. IRSA does not need the Kubernetes API token: the EKS pod identity
# webhook injects its own projected token (audience sts.amazonaws.com) and the
# AWS_ROLE_ARN / AWS_WEB_IDENTITY_TOKEN_FILE variables independently of this
# setting.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE>
automountServiceAccountToken: false
