# DRAFT for gate A5 approval (ADR-0027). Not applied; nothing is deployed.
#
# edge-api's two secret files (INTERNAL-TESTING-SETUP C4), delivered by the
# External Secrets Operator from AWS Secrets Manager in ap-south-1 into the
# Secret `edge-api-secrets`, mounted read-only by the Deployment.
#
#   access-token-public-key.pem  the PUBLIC half of identity's signing key (B5):
#                                PEM "PUBLIC KEY", PKIX, Ed25519, <= 16 KiB.
#                                Not confidential, but delivered the same way
#                                so that it is integrity-controlled.
#   database-dsn                 one line: a connection string to THE SAME
#                                database identity migrates (C4; the DPoP
#                                replay table is created by identity's
#                                migrations), with sslmode=verify-full and
#                                sslrootcert=/etc/lily/db-ca/ca-bundle.pem
#                                (ADR-0029). SRE decides whether edge-api uses
#                                its own database role (recommended: least
#                                privilege) or identity's.
#
# The rotation-only variables (CS_EDGE_API_ACCESS_TOKEN_PREVIOUS_*) are not
# provisioned here; the rotation runbook adds a third key when one is needed.
#
# API version: see identity-externalsecret.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: edge-api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-ap-south-1
  target:
    name: edge-api-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: access-token-public-key.pem
      remoteRef:
        key: <PLACEHOLDER>/staging/edge-api/access-token-public-key
        decodingStrategy: None
    - secretKey: database-dsn
      remoteRef:
        key: <PLACEHOLDER>/staging/edge-api/database-dsn
        decodingStrategy: None
