# =============================================================================
# Prometheus scrape configuration for the LOCAL development stack.
#
# Production scrape configuration is generated from ServiceMonitor resources in
# infra/observability and is not derived from this file. This exists so that a
# metric added during development is visible immediately, rather than being
# discovered to be malformed after it reaches staging.
# =============================================================================

global:
  # 15s locally rather than production's longer interval: during development the
  # feedback loop matters more than storage cost, and the retention window here
  # is only 24 hours.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    region: local

scrape_configs:
  # Prometheus scrapes itself so that the stack's own health is visible. If
  # scraping is broken, this is the target that shows it.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Platform services.
  #
  # Targets point at the PROBE port (8081), not the application port. Metrics
  # are served alongside the health endpoints so that scraping continues to work
  # while the application listener is saturated or draining — which is precisely
  # when the metrics are most worth having.
  #
  # Services are listed explicitly rather than discovered. Docker service
  # discovery would require mounting the Docker socket into the Prometheus
  # container, which grants effective root on the host and is not a trade worth
  # making for a local convenience.
  - job_name: callscreen-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - "edge-api:8081"
          - "identity:8081"
          - "billing:8081"
          - "contacts-sync:8081"
          - "notification-fanout:8081"
          - "telephony-gateway:8081"
          - "media-relay:8081"
          - "session-orchestrator:8081"
          - "ai-orchestrator:8081"
          - "asr-gateway:8081"
          - "tts-gateway:8081"
          - "fraud-engine:8081"
          - "transcript-service:8081"
          - "prompt-registry:8081"
        labels:
          tier: platform
    relabel_configs:
      # Derive a clean `service` label from the target address so that queries
      # read `service="edge-api"` rather than carrying the port around.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
        replacement: "$1"

# No alerting rules are defined here on purpose. Alerts are owned by
# infra/observability/alerts and are validated in CI; duplicating them locally
# would create a second definition that drifts, and a local alert nobody
# receives is not an alert.
